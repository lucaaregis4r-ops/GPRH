name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-phaser/package-lock.json

      - name: Install Phaser UI dependencies
        run: npm ci --prefix ui-phaser

      - name: Run tests
        run: npm --prefix ui-phaser test
